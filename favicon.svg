<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Pitch Black Gradient -->
        <radialGradient id="pitch-black-bg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#020816"/>
            <stop offset="60%" stop-color="#000000"/>
            <stop offset="100%" stop-color="#000000"/>
        </radialGradient>
    </defs>

    <!-- Base Chassis -->
    <rect width="512" height="512" rx="112" fill="#000000"/>
    <rect x="12" y="12" width="488" height="488" rx="102" fill="url(#pitch-black-bg)" stroke="rgba(56, 189, 248, 0.18)" stroke-width="3"/>

    <!-- Concentric Scope Rings (Electric Blue Theme) -->
    <circle cx="256" cy="256" r="206" fill="none" stroke="#e0f2fe" stroke-opacity="0.25" stroke-width="6"/>
    <circle cx="256" cy="256" r="124" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="4" stroke-dasharray="14 10"/>

    <!-- Center Accent Ring -->
    <circle cx="256" cy="256" r="60" fill="none" stroke="#0284c7" stroke-opacity="0.5" stroke-width="4"/>

    <!-- Crosshairs -->
    <line x1="50" y1="256" x2="462" y2="256" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4"/>
    <line x1="256" y1="50" x2="256" y2="462" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4"/>
</svg>